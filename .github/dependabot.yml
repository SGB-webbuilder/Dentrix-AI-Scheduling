version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '02:00'
      timezone: Asia/Manila
    open-pull-requests-limit: 5
    versioning-strategy: increase
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '02:00'
      timezone: Asia/Manila
    open-pull-requests-limit: 5
# No auto-merge. Every update requires review and refresh of dependency-review evidence.
