name: Bug report
description: Technical defect record linked to the authoritative ClickUp task.
title: '[Bug] '
body:
  - type: markdown
    attributes:
      value: Do not include patient information, credentials, raw payloads, or restricted documents. Report security vulnerabilities through the private process in SECURITY.md.
  - type: textarea
    id: clickup
    attributes:
      label: ClickUp task link
      description: Link the authoritative task; this issue must not create a second execution backlog.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Use synthetic examples and identify the affected module.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and candidate
      description: Steps, commit, environment class, and sanitized checks. Do not include tenant identifiers.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact and acceptance criteria
      description: Describe severity and the evidence needed to verify a fix.
    validations:
      required: true
