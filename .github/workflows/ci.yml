name: Foundation CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check tracked files for limited secret patterns
        run: node scripts/scan-secrets.mjs --tracked
      - name: Validate foundation structure (application build pending)
        run: node scripts/validate-foundation.mjs
      - name: Test foundation checks using Node core
        run: node --test tests/foundation/*.test.mjs

  reviewed-tooling:
    name: Reviewed tooling checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Require evidenced candidate dependency review before installation
        run: node scripts/check-dependency-review.mjs
      - name: Install approved exact npm version without lifecycle scripts
        run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - name: Install locked reviewed tooling without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Lint foundation tooling
        run: npm run lint
      - name: Typecheck foundation tooling (application types pending)
        run: npm run typecheck
      - name: Check formatting
        run: npm run format:check
      - name: Audit all locked dependency severities
        run: npm run audit:dependencies
